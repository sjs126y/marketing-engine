<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>对话助手</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#fff;color:#0f172a;font-size:14px;height:100vh;overflow:hidden}
  .app{display:flex;height:100vh}

  /* ---------- 左侧栏 ---------- */
  .side{width:260px;flex:0 0 260px;border-right:1px solid #eef0f3;background:#fbfbfc;display:flex;flex-direction:column;padding:14px;min-height:0}
  .brand{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 14px}
  .brand .l{display:flex;align-items:center;gap:9px}
  .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
  .brand b{font-size:14px}
  .ghost{border:0;background:transparent;color:#94a3b8;cursor:pointer;font-size:12px;padding:4px}
  .ghost:hover{color:#475569}
  .newchat{border:1px solid #e2e5ea;background:#fff;border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;color:#334155;width:100%;font:inherit;text-align:left}
  .newchat:hover{background:#f5f6f8}
  .section{font-size:11px;color:#94a3b8;margin:16px 6px 6px;letter-spacing:.3px;display:flex;justify-content:space-between}
  .convs{overflow-y:auto;min-height:0;flex:1}
  .conv{padding:8px 10px;border-radius:8px;color:#475569;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
  .conv:hover{background:#f1f3f6}
  .empty{color:#c3cbd6;font-size:12px;padding:6px 10px}

  .wallet{border:1px solid #e8ebef;border-radius:12px;padding:12px;background:#fff;margin-top:10px}
  .wallet .row{display:flex;justify-content:space-between;align-items:baseline}
  .wallet .row + .row{margin-top:6px}
  .wallet .k{font-size:11px;color:#94a3b8}
  .wallet .v{font-size:18px;font-weight:600}
  .wallet .sign{margin-top:10px;width:100%;border:0;border-radius:8px;padding:8px;background:#111827;color:#fff;font-size:13px;cursor:pointer}
  .wallet .sign:hover{background:#1f2937}
  .wallet .sign:disabled{background:#cbd5e1;cursor:default}
  .wallet .link{display:block;text-align:center;margin-top:8px;font-size:12px;color:#2563eb;text-decoration:none;background:none;border:0;cursor:pointer;width:100%}
  .wallet .link:hover{text-decoration:underline}

  /* ---------- 主区 ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:52px;flex:0 0 52px;border-bottom:1px solid #eef0f3;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
  .model{display:flex;align-items:center;gap:8px;color:#334155;font-size:13px}
  .dot{width:6px;height:6px;border-radius:50%;background:#22c55e}
  .user{display:flex;align-items:center;gap:9px;color:#64748b;font-size:13px}
  .avatar{width:26px;height:26px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#475569;font-weight:600}

  .stream{flex:1;overflow-y:auto;padding:26px 0}
  .msg{max-width:760px;margin:0 auto 22px;padding:0 20px;display:flex;gap:12px}
  .who{flex:0 0 26px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;margin-top:2px}
  .msg.ai .who{background:#eef2ff;color:#3730a3}
  .msg.me .who{background:#f1f5f9;color:#475569}
  .bubble{line-height:1.75;padding-top:2px;min-width:0}
  .bubble p{margin:0 0 10px}
  .bubble code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:12.5px}
  .cost{margin-top:10px;font-size:12px;color:#94a3b8}

  .composer{flex:0 0 auto;padding:0 20px 16px}
  .box{max-width:760px;margin:0 auto;border:1px solid #e2e5ea;border-radius:14px;padding:10px 12px;display:flex;align-items:flex-end;gap:10px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .box:focus-within{border-color:#c7d2fe;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
  .box textarea{flex:1;border:0;outline:none;resize:none;font:inherit;color:#0f172a;min-height:24px;max-height:120px;line-height:1.6}
  .send{width:30px;height:30px;border-radius:8px;border:0;background:#111827;color:#fff;cursor:pointer;font-size:14px}
  .send:disabled{background:#cbd5e1;cursor:default}
  .hint{max-width:760px;margin:8px auto 0;font-size:11px;color:#94a3b8;text-align:center}

  #toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
  .toast-item{background:#111827;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
  .toast-item.bad{background:#b91c1c}
  @media(max-width:820px){ .side{display:none} }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="l"><div class="logo">AI</div><b>对话助手</b></div>
      <button class="ghost" onclick="logout()" title="退出登录">退出</button>
    </div>

    <button class="newchat" onclick="newChat()">＋ 新对话</button>

    <div class="section"><span>最近的提问</span></div>
    <div class="convs" id="convs"><div class="empty">还没有提问</div></div>

    <div class="wallet">
      <div class="row"><span class="k">积分</span><span class="v" id="credit">—</span></div>
      <div class="row"><span class="k">对话次数</span><span class="v" id="quota">—</span></div>
      <button class="sign" id="signBtn" onclick="doSign()">今日签到 +10 积分</button>
      <button class="link" onclick="goPlay()">去抽奖赢对话次数 ↗</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="model"><span class="dot"></span> deepseek-chat</div>
      <div class="user"><span id="who">—</span><div class="avatar" id="avatar">?</div></div>
    </div>

    <div class="stream" id="stream">
      <div class="msg ai">
        <div class="who">AI</div>
        <div class="bubble">
          <p>你好，我是对话助手。每次对话消耗 <code>1</code> 积分。</p>
          <p>积分可以从<b>每日签到</b>获得，也可以在<b>抽奖</b>里抽到；抽中的对话次数会由中台异步回调到你的账户。</p>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="box">
        <textarea id="input" rows="1" placeholder="给对话助手发送消息…"
                  onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
        <button class="send" id="sendBtn" onclick="send()">↑</button>
      </div>
      <div class="hint">对话由 AI 助手提供 · 每次消耗 1 积分 · 积分不足可以去抽奖</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let state = { userId: '', nickname: '', credit: 0, llmQuota: 0, signedToday: false };

function toast(text, bad) {
  const el = document.createElement('div');
  el.className = 'toast-item' + (bad ? ' bad' : '');
  el.textContent = text;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

async function api(path, body) {
  const resp = await fetch(path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (resp.status === 401) { window.location.href = '/login'; throw new Error('未登录'); }
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.reason || data.detail || ('HTTP ' + resp.status));
  return data;
}

function renderWallet() {
  document.getElementById('credit').textContent = state.credit;
  document.getElementById('quota').textContent = state.llmQuota;
  document.getElementById('who').textContent = state.nickname || state.userId;
  document.getElementById('avatar').textContent = (state.nickname || state.userId || '?').slice(0, 1).toUpperCase();

  const btn = document.getElementById('signBtn');
  if (state.signedToday) {
    btn.textContent = '今日已签到';
    btn.disabled = true;
  } else {
    btn.textContent = '今日签到 +10 积分';
    btn.disabled = false;
  }
}

function renderHistory(flows) {
  const box = document.getElementById('convs');
  const prompts = JSON.parse(localStorage.getItem('upstream.prompts') || '[]');
  if (!prompts.length) { box.innerHTML = '<div class="empty">还没有提问</div>'; return; }
  box.innerHTML = prompts.map(p =>
    `<div class="conv" title="${escapeHtml(p)}" onclick="fillInput(${JSON.stringify(p).replace(/"/g, '&quot;')})">${escapeHtml(p)}</div>`
  ).join('');
}

function fillInput(text) {
  const input = document.getElementById('input');
  input.value = text;
  input.focus();
}

function rememberPrompt(text) {
  const list = JSON.parse(localStorage.getItem('upstream.prompts') || '[]');
  list.unshift(text);
  localStorage.setItem('upstream.prompts', JSON.stringify(list.slice(0, 8)));
  renderHistory([]);
}

async function loadMe() {
  try {
    const data = await api('/api/me');
    state = { ...state, ...data };
    renderWallet();
    renderHistory(data.flows);
  } catch (e) {
    if (e.message !== '未登录') toast('加载失败：' + e.message, true);
  }
}

async function doSign() {
  try {
    const r = await api('/api/sign', {});
    if (r.ok) toast('签到成功，+' + r.credit + ' 积分');
    else toast(r.reason || '签到未成功', true);
    loadMe();
  } catch (e) { toast('签到失败：' + e.message, true); }
}

async function goPlay() {
  try {
    const r = await api('/api/play-link');
    if (r.ok && r.url) window.open(r.url, '_blank');
    else toast('获取抽奖链接失败', true);
  } catch (e) { toast('获取抽奖链接失败：' + e.message, true); }
}

async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login';
}

function newChat() {
  document.getElementById('stream').innerHTML = `
      <div class="msg ai">
        <div class="who">AI</div>
        <div class="bubble"><p>新的对话开始了。你想聊点什么？</p></div>
      </div>`;
  document.getElementById('input').value = '';
  document.getElementById('input').focus();
}

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;

  const stream = document.getElementById('stream');
  stream.insertAdjacentHTML('beforeend',
    `<div class="msg me"><div class="who">我</div><div class="bubble">${escapeHtml(text)}</div></div>`);
  input.value = '';
  input.style.height = 'auto';
  rememberPrompt(text);

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  try {
    const r = await api('/api/chat', { message: text });
    if (r.ok) {
      stream.insertAdjacentHTML('beforeend',
        `<div class="msg ai"><div class="who">AI</div><div class="bubble">
           <p>${escapeHtml(r.reply)}</p>
           <div class="cost">本次消耗 1 积分 · 剩余 ${r.credit}</div>
         </div></div>`);
    } else {
      stream.insertAdjacentHTML('beforeend',
        `<div class="msg ai"><div class="who">AI</div><div class="bubble">
           <p>${escapeHtml(r.reason || '暂时不能回复')}</p>
         </div></div>`);
    }
    stream.scrollTop = stream.scrollHeight;
    loadMe();
  } catch (e) {
    toast('对话失败：' + e.message, true);
  } finally {
    btn.disabled = false;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 输入框自适应高度
document.getElementById('input').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

loadMe();
setInterval(loadMe, 8000);  // 中台回调是异步的，定时刷新能看到奖品入账
</script>
</body>
</html>
