server:
  port: 8092
  tomcat:
    threads:
      max: 200        # 设定处理客户请求的线程的最大数目，决定了服务器可以同时响应客户请求的数,默认200
      min-spare: 50   # 初始化线程数,最小空闲线程数,默认是10
    accept-count: 10  # 等待队列长度

# 应用配置
app:
  config:
    # 版本，方便通过接口版本升级
    api-version: v1
    # 跨域，开发阶段可以设置为 * 不限制
    cross-origin: '*'
  # 分库分表数据源：db0 为配置库，db1/db2 为分片库（由 ShardingSphere 路由）
  sharding:
    db0:
      url: jdbc:mysql://127.0.0.1:13306/marketing_engine?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:123456}
    db1:
      url: jdbc:mysql://127.0.0.1:13306/marketing_engine_01?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:123456}
    db2:
      url: jdbc:mysql://127.0.0.1:13306/marketing_engine_02?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:123456}

  # 本地消息表（outbox）调度参数
  outbox:
    batch-size: 200            # 单次扫描条数
    max-retry: 8               # 超过进入 dead，等待人工处理
    stuck-seconds: 120         # sending 超时视为进程崩溃，退回 pending
    consume-timeout-seconds: 300  # sent 后超时未回执，重新投递（消费端需幂等）
    max-backoff-seconds: 300   # 退避上限

  # 鉴权：三类主体三套凭证。本地演示默认关闭，生产必须开启
  auth:
    enabled: false
    jwt-secret: ${JWT_SECRET:marketing-engine-local-dev-secret-change-me}
    user-token-ttl-seconds: 7200
    operator-token-ttl-seconds: 28800
    timestamp-skew-seconds: 300
    rate-limit-per-minute: 600
    operators:
      admin:
        # 口令 admin123（BCrypt）
        password-hash: ${OPERATOR_ADMIN_HASH:$2a$10$dg6vqYdVHQgxjdyHVLer3uejQTtsI/nK3jB62QpMolH42i4LnCio6}
        role: ADMIN
      operator:
        # 口令 operator123（BCrypt）
        password-hash: ${OPERATOR_HASH:$2a$10$boSb1CAh2dqkUpAZV0nIQeLySiZgPFl7garSSKeMNCQ.4/V/2LdAu}
        role: OPERATOR
    api-clients:
      demo-client:
        secret: ${OPEN_API_SECRET:demo-secret-please-change}
        name: 演示接入方

# Spring 配置；rabbitmq
spring:
  rabbitmq:
    addresses: 127.0.0.1
    port: 5672
    username: admin
    password: admin
    listener:
      simple:
        prefetch: 1 # 每次投递n个消息，消费完在投递n个
    topic:
      activity_sku_stock: activity_sku_stock
      activity_sku_stock_zero: activity_sku_stock_zero
      send_award: send_award
      send_rebate: send_rebate

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# MyBatis 配置【如需使用记得打开】
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location:  classpath:/mybatis/config/mybatis-config.xml

# Redis
redis:
  sdk:
    config:
      host: 127.0.0.1
      port: 16379
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true


# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml
# 指标与健康检查：GET /actuator/prometheus、GET /actuator/health
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: marketing-engine